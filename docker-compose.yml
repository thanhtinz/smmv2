services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smmv2
      POSTGRES_USER: smmv2
      POSTGRES_PASSWORD: <redacted>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smmv2-db:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: "postgresql://smmv2:smmv2-pass@db:5432/smmv2"
      AUTH_SECRET: "<redacted>
      CRON_SECRET: "<redacted>
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
    command: sh -c "npx prisma db push && npm run db:seed && npm start"
volumes:
  smmv2-db:
